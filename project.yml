name: Pedal
options:
  bundleIdPrefix: com.sahilquazi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Pedal:
    type: application
    platform: iOS
    sources:
      - path: Pedal
      - path: Shared
    dependencies:
      - target: PedalWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahilquazi.pedal
        PRODUCT_NAME: Pedal
        INFOPLIST_FILE: Pedal/Info.plist
        # Entitlements hold the Apple Pay merchant ID and NFC formats.
        # On a free Apple ID, run ios/free-account-mode.sh on to drop them for device builds.
        CODE_SIGN_ENTITLEMENTS: Pedal/Pedal.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_TEAM: 4U2M65374F
  # Ride Live Activity (lock screen + Dynamic Island).
  PedalWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PedalWidgets
      - path: Shared
    info:
      path: PedalWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pedal
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahilquazi.pedal.widgets
        PRODUCT_NAME: PedalWidgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4U2M65374F
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
  # UI tests that drive the app for the feature screen recordings (video/app-clips).
  PedalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PedalUITests
    dependencies:
      - target: Pedal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahilquazi.pedal.uitests
        TEST_TARGET_NAME: Pedal
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4U2M65374F
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Pedal:
    build:
      targets:
        Pedal: all
        PedalUITests: [test]
    test:
      config: Debug
      targets:
        - PedalUITests
    run:
      config: Debug
